# See: https://packaging.python.org/en/latest/tutorials/packaging-projects/
# See: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[project]
name = "gitcache"
description = "Gitcache mirrors Git repositories into a deduped pooled object store on top of Bitcache content-addressable storage."
readme = "README.md"
authors = [{ name = "Arto Bendiken", email = "arto@bendiken.net" }]
license = "Unlicense"
license-files = ["UNLICENSE"]
version = "0.0.0"

requires-python = ">=3.14"
dependencies = []

keywords = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: Public Domain",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
dev = ["distrib.sh>=0.0.0"]

[project.urls]
Homepage = "https://gitcache.dev"
Repository = "https://github.com/artob/gitcache"
Changelog = "https://github.com/artob/gitcache/blob/master/CHANGES.md"
Releases = "https://github.com/artob/gitcache/releases"
Issues = "https://github.com/artob/gitcache/issues"
Documentation = "https://github.com/artob/gitcache/blob/master/python/README.md"

[tool.uv.build-backend]
module-name = "gitcache"
